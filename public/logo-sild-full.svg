<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <!-- Blue bar -->
  <rect x="30" y="30" width="62" height="250" fill="#0F3D5E"/>
  <!-- Icon -->
  <g transform="translate(124,30)" stroke="#000" stroke-width="3.4" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Outer square - 3 sides, bottom open -->
    <path d="M0 0 H220 V190"/>
    <path d="M20 20 H200 V170"/>
    <path d="M40 40 H180 V150"/>
    <path d="M60 60 H160 V130"/>
    <rect x="80" y="80" width="60" height="60" stroke-width="3.4"/>
    <!-- 4 horizontal lines at bottom -->
    <g stroke-width="3.4">
      <line x1="0" y1="202" x2="220" y2="202"/>
      <line x1="0" y1="216" x2="220" y2="216"/>
      <line x1="0" y1="230" x2="220" y2="230"/>
      <line x1="0" y1="244" x2="220" y2="244"/>
    </g>
  </g>
  <!-- SILD text - thin -->
  <text x="390" y="200" font-family="Inter, Helvetica, Arial, sans-serif" font-size="150" font-weight="200" letter-spacing="8" fill="#000">SILD</text>
  <!-- Lines -->
  <rect x="390" y="218" width="132" height="6" fill="#0F3D5E"/>
  <rect x="538" y="218" width="380" height="6" fill="#000"/>
  <!-- SYSTEMY OGRODZEŃ -->
  <text x="390" y="262" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="7.5" fill="#000">SYSTEMY OGRODZEŃ</text>
  <!-- STRZESZEWSKI -->
  <text x="390" y="298" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="9.5" fill="#000">STRZESZEWSKI</text>
</svg>